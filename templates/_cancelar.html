{% if d.status != 'Cancelada' %}<details class="card noprint"><summary>Cancelar este chamado</summary>
<p class=mut>O chamado não é apagado: continua no sistema como "Cancelada", com a justificativa registrada no histórico.</p>
<form method=post action="/d/{{d.id}}/cancelar"><label>Justificativa (obrigatória)</label><textarea name=motivo rows=3 required></textarea>
<label>Cancelado por</label><input name=autor style="max-width:260px">
<p><button class=s onclick="return confirm('Cancelar este chamado?')">Cancelar chamado</button></p></form></details>{% endif %}
